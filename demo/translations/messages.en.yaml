home:
    title: 'One PHP class. A full-featured table.'
    summary: 'UX DataTables turns a Symfony class into a sortable, searchable, editable DataTables.net grid. Every table in this demo is built only with what the bundle ships.'
    how: 'How it works'
    how_summary: 'Describe the columns in a class, inject it in a controller, render it in Twig. The code below is the exact code running the table above.'
    tour: 'Explore the tour'

code:
    title: 'The code behind this table'
    label: 'Source code'
    copy: 'Copy'
    copied: 'Copied'

page:
    features: 'APIs used on this page'
    docs: 'Read the docs'
    next: 'Next'
    overview:
        title: 'Overview'
        intro: 'Products from Doctrine with images, prices, badges, an inline switch, row actions, and export buttons.'
        try: 'Toggle “Featured”, edit a product, or resize the window to watch columns collapse.'
    client_side:
        title: 'Client-side table'
        intro: 'The smallest table: a PHP array passed to data(). No entity, no database, no Ajax.'
        try: 'Search, sort, and page: everything runs in the browser.'
    server_side:
        title: 'Server-side processing'
        intro: 'Ten thousand orders paginated, searched, and sorted by Doctrine. The browser only receives the visible page.'
        try: 'Sort by total or search a customer, then copy the URL: the table state lives in it.'
    columns:
        title: 'Column types'
        intro: 'Every built-in column type in one table, from money and images to icons, relative dates, and a Twig template.'
        try: 'Each column formats its own value: compare the raw entity with what you see.'
    filters:
        title: 'Filters'
        intro: 'A filter bar above the table, applied as Doctrine conditions: text, choices, date range, yes/no, and a custom query.'
        try: 'Pick two statuses and a date range, then apply.'
    attributes:
        title: 'Attributes'
        intro: 'Columns and filters declared on the entity with PHP attributes. The table class is almost empty.'
        try: 'Open the Customer.php tab: that is where this table is configured.'
    actions:
        title: 'Actions and edit modal'
        intro: 'Expandable detail rows, an edit form generated from the entity, a guarded delete, and an inline switch.'
        try: 'Edit a product and save. Delete only shows on archived products.'
    bulk_actions:
        title: 'Bulk actions'
        intro: 'Select rows across pages and run a server-side action on all of them, with confirmation and feedback.'
        try: 'Select a few orders and mark them as shipped: only paid orders change, the others are reported as skipped.'
    export:
        title: 'Export'
        intro: 'Copy, CSV, Excel, PDF, and print buttons. Columns can opt out of exports.'
        try: 'Export to Excel: the Supplier column stays out of the file.'
    layout:
        title: 'Scrolling and fixed columns'
        intro: 'Virtual scrolling through 10,000 server-side rows with the first column pinned while you scroll sideways.'
        try: 'Scroll down fast, then sideways: the reference column stays in place.'
    column_tools:
        title: 'Column tools'
        intro: 'Per-column controls, drag-to-reorder headers, grouped rows, keyboard navigation, and a column visibility menu.'
        try: 'Drag a header, search a single column, move with the arrow keys, or hide a column.'

