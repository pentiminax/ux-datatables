flash.reset: 'Données restaurées : 60 produits, 500 clients, 10 000 commandes.'

group:
    start: 'Démarrer'
    essentials: 'Essentiels'
    interactions: 'Interactions'
    extensions: 'Extensions'

home:
    title: 'Une classe PHP. Une table complète.'
    summary: 'UX DataTables transforme une classe Symfony en grille DataTables.net triable, filtrable et éditable. Chaque table de cette démo utilise uniquement ce que le bundle fournit.'
    how: 'Comment ça marche'
    how_summary: 'Décrivez les colonnes dans une classe, injectez-la dans un contrôleur, affichez-la en Twig. Le code ci-dessous est exactement celui qui fait tourner la table ci-dessus.'
    tour: 'Explorer la visite'

code:
    title: 'Le code derrière cette table'
    label: 'Code source'
    copy: 'Copier'
    copied: 'Copié'

page:
    features: 'API utilisées sur cette page'
    docs: 'Lire la documentation'
    next: 'Suivant'
    overview:
        title: 'Vue d’ensemble'
        intro: 'Des produits Doctrine avec images, prix, badges, interrupteur en ligne, actions et boutons d’export.'
        try: 'Basculez « Mis en avant », modifiez un produit ou réduisez la fenêtre pour voir les colonnes se replier.'
    client_side:
        title: 'Table côté client'
        intro: 'La table minimale : un tableau PHP passé à data(). Ni entité, ni base de données, ni Ajax.'
        try: 'Recherchez, triez, paginez : tout se passe dans le navigateur.'
    server_side:
        title: 'Traitement côté serveur'
        intro: 'Dix mille commandes paginées, recherchées et triées par Doctrine. Le navigateur ne reçoit que la page visible.'
        try: 'Triez par total ou cherchez un client, puis copiez l’URL : l’état de la table y est conservé.'
    columns:
        title: 'Types de colonnes'
        intro: 'Tous les types de colonnes fournis dans une seule table : montants, images, icônes, dates relatives et template Twig.'
        try: 'Chaque colonne formate sa valeur. « Tranche de prix » est calculée en PHP à partir du prix, mais le tri suit toujours le prix.'
    filters:
        title: 'Filtres'
        intro: 'Une barre de filtres appliqués comme conditions Doctrine : texte, choix, plage de dates, oui/non et requête personnalisée.'
        try: 'Choisissez deux statuts et une plage de dates, puis appliquez.'
    attributes:
        title: 'Attributs'
        intro: 'Colonnes et filtres déclarés sur l’entité avec des attributs PHP. La classe de la table est presque vide.'
        try: 'Ouvrez l’onglet Customer.php : c’est là que cette table est configurée.'
    actions:
        title: 'Actions et modale d’édition'
        intro: 'Lignes de détail dépliables, formulaire d’édition généré depuis l’entité, suppression conditionnelle et interrupteur en ligne.'
        try: 'Modifiez un produit et enregistrez. La suppression n’apparaît que sur les produits archivés ; la ligne sous la table indique chaque résultat.'
    bulk_actions:
        title: 'Actions groupées'
        intro: 'Sélectionnez des lignes sur plusieurs pages et lancez une action serveur sur toutes, avec confirmation et retour.'
        try: 'Sélectionnez quelques commandes et marquez-les comme expédiées : seules les commandes payées changent, les autres sont signalées comme ignorées.'
    export:
        title: 'Export'
        intro: 'Boutons copier, CSV, Excel, PDF et impression. Les exports côté serveur diffusent toutes les lignes filtrées et écrivent ce que la table affiche.'
        try: 'Comparez CSV et CSV (raw) : euros et libellés de catégorie contre centimes et valeurs stockées. La colonne Fournisseur reste hors des deux.'
    layout:
        title: 'Défilement et colonnes figées'
        intro: 'Défilement virtuel de 10 000 lignes côté serveur, avec la première colonne figée pendant le défilement horizontal.'
        try: 'Faites défiler vite vers le bas, puis sur le côté : la colonne référence reste en place.'
    column_tools:
        title: 'Outils de colonnes'
        intro: 'Contrôles par colonne, en-têtes réordonnables par glisser-déposer, lignes groupées, navigation clavier et menu de visibilité.'
        try: 'Glissez un en-tête, cherchez dans une seule colonne, déplacez-vous avec les flèches ou masquez une colonne.'

