name: "Test Suite"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Dump PHP diagnostics
        run: php -i && php -m

      - name: Install dependencies
        run: composer install --no-progress

      - name: Check for dangerous and broken dependencies
        run: composer audit

      - name: Check coding standards
        if: matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run automated tests
        run: vendor/bin/phpunit --coverage-text --coverage-xml build/coverage-xml --coverage-cobertura build/cobertura.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lowest dependencies
            php: '8.2'
            composer-flags: '--prefer-lowest --prefer-stable'
          - name: Symfony 7.4
            php: '8.2'
            symfony: '7.4.*'
          - name: Symfony 8
            php: '8.4'
            symfony: '8.*'
    name: ${{ matrix.name }}
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
      # The bridge at its lowest version fails on self deprecations that the default one tolerates.
      SYMFONY_DEPRECATIONS_HELPER: max[direct]=0&max[self]=99999&verbose=0&quiet[]=indirect
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, ${{ matrix.symfony && 'flex' || '' }}

      - name: Install dependencies
        run: composer update --no-progress ${{ matrix.composer-flags }}

      - name: Run automated tests
        run: vendor/bin/phpunit

  demo:
    runs-on: ubuntu-latest
    name: Demo app
    env:
      APP_SECRET: ci-only-demo-secret
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-progress

      - name: Download importmap packages
        run: php bin/console importmap:install

      - name: Lint container and templates
        run: php bin/console lint:container && php bin/console lint:twig templates

      - name: Run smoke tests
        run: php bin/phpunit

  js:
    runs-on: ubuntu-latest
    name: JS
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm ci --no-progress

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Source maps are left out: their mappings differ between build environments even when the
      # emitted code is identical, so only the files the bundle ships are compared.
      - name: Check that dist matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist ':(exclude)*.map')" ]; then
            echo "assets/dist is out of date: run 'npm run build' in assets/ and commit the result."
            git status --short -- dist ':(exclude)*.map'
            git diff --stat -- dist ':(exclude)*.map'
            exit 1
          fi
