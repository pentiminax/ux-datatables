name: "Test Suite"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Dump PHP diagnostics
        run: php -i && php -m

      - name: Install dependencies
        run: composer install --no-progress

      - name: Check for dangerous and broken dependencies
        run: composer audit

      - name: Check coding standards
        if: matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run automated tests
        run: vendor/bin/phpunit --coverage-text --coverage-xml build/coverage-xml --coverage-cobertura build/cobertura.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  js:
    runs-on: ubuntu-latest
    name: JS
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm ci --no-progress

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Source maps are left out: their mappings differ between build environments even when the
      # emitted code is identical, so only the files the bundle ships are compared.
      - name: Check that dist matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist ':(exclude)*.map')" ]; then
            echo "assets/dist is out of date: run 'npm run build' in assets/ and commit the result."
            git status --short -- dist ':(exclude)*.map'
            git diff --stat -- dist ':(exclude)*.map'
            exit 1
          fi
