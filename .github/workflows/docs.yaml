name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Cache Astro incremental build
        uses: actions/cache@v4
        with:
          path: docs/node_modules/.astro
          key: astro-incremental-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/src/**', 'docs/astro.config.mjs', 'docs/src/content.config.*') }}
          restore-keys: |
            astro-incremental-${{ hashFiles('docs/package-lock.json') }}-
            astro-incremental-

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs

      - name: Build Astro site
        run: npm run build
        working-directory: ./docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5